  - labels:
      - 统一社会信用代码
      - 纳税人识别号
      - 税号
      - 营业执照号
    category: social_credit_code
    pattern: "\\b[0-9A-HJ-NPQRTUWXY]{15,20}\\b"

  - labels:
      - 证件号
      - 证件号码
      - 身份证号码
      - 身份证号
    category: id_card
    pattern: "(?<!\\d)[1-9]\\d{5}(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])\\d{3}[\\dXx](?!\\d)"

  - labels:
      - 护照号
      - 护照号码
    category: passport
    pattern: "\\b[EGPSeps][0-9]{8}\\b"

  - labels:
      - 合同编号
      - 合同号
      - 采购编号
      - 订单编号
      - 项目编号
      - 资产编号
      - 发票号码
      - 发票代码
      - 开户许可证号
      - 样例序列号
      - 序列号
      - SN
      - S/N
    category: contract
    pattern: "[A-Za-z0-9][A-Za-z0-9_-]{4,40}"

  - labels:
      - 快递单号
      - 运单号
      - 物流单号
      - 设备编号
      - 机器码
      - 许可证号
      - 授权码
      - 登录账号
      - 用户名
      - 用户ID
      - 微信号
      - QQ号
      - 钉钉号
      - AppID
      - AccessKey
      - SecretKey
      - Token
      - API Key
    category: custom
    pattern: "[A-Za-z0-9_@.\\-]{4,80}"

  - labels:
      - 服务器IP
      - IP地址
    category: ip
    pattern: "\\b(?:(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\.){3}(?:25[0-5]|2[0-4]\\d|1?\\d?\\d)\\b"

  - labels:
      - MAC地址
      - Mac地址
    category: secret
    pattern: "\\b[0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5}\\b"

