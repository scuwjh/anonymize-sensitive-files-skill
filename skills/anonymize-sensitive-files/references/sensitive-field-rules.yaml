fields:
  - labels:
      - 紧急联系人
      - 应急联系人
      - 紧急联络人
      - 应急联络人
    components:
      - category: name
        pattern: "[\\u4e00-\\u9fff]{2,4}"
      - category: phone
        pattern: "(?<!\\d)(?:\\+?86[- ]?)?1[3-9](?:[- ]?\\d){9}(?!\\d)"

  - labels:
      - 姓名
      - 联系人
      - 负责人
      - 经办人
      - 制单人
      - 审核人
      - 审批人
      - 申请人
      - 报销人
      - 法定代表人
      - 法人代表
      - 委托代理人
      - 承办人
      - 对接人
      - 寄件人
      - 收款联系人
      - 付款联系人
      - 财务联系人
      - 财务联络人
      - 财务负责人
      - 收件人
      - 收货人
      - 接收人
      - 签收人
      - 授权代表
      - 签约代表
      - 采购联系人
      - 销售联系人
      - 售后联系人
      - 项目经理
      - 客户经理
