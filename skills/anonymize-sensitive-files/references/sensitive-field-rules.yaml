      - 联系手机
      - 手机号
      - 手机
      - 电话
      - 传真
    category: phone
    pattern: "(?<!\\d)(?:\\+?86[- ]?)?1[3-9](?:[- ]?\\d){9}(?!\\d)|(?<!\\d)0\\d{2,3}[- ]?\\d{7,8}(?:[- ]?\\d{1,6})?(?!\\d)"

  - labels:
      - 电子邮箱
      - 工作邮箱
      - 联系邮箱
      - 开票邮箱
      - 收件邮箱
      - 通知邮箱
      - 邮箱
      - Email
      - E-mail
    category: email
    pattern: "\\b[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}\\b"

  - labels:
      - 联行号
      - 银行联行号
      - 支付系统行号
      - CNAPS
      - CNAPS号
    category: bank_routing_code
    pattern: "(?<!\\d)\\d{12}(?!\\d)"

  - labels:
      - 银行账号
      - 开户账号
      - 收款账号
      - 付款账号
      - 对公账号
      - 结算账户
      - 收款账户
      - 付款账户
      - 银行卡号
      - 账号
      - 账户
    category: bank_card
    pattern: "(?<!\\d)\\d[\\d -]{13,34}\\d(?!\\d)"

  - labels:
      - 甲方
      - 乙方
      - 买方
      - 卖方
      - 采购方
      - 供货方
      - 服务方
